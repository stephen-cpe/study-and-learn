<div class="mascot-wrapper"
     style="--mascot-frame-w: {{ mascot_config.frame_width }}px; --mascot-frame-h: {{ mascot_config.frame_height }}px; --mascot-ground: {{ mascot_config.ground_offset }}px;">
    <div id="mascot"
         class="mascot-sprite"
         role="img"
         aria-label="{{ mascot_config.name }} mascot"
         tabindex="0"></div>
    <div id="speech-bubble">
        <span id="bubble-text">Booting neural link...</span>
        <div id="bubble-progress" class="bubble-progress" style="display:none;">
            <div class="bubble-progress-track"><div class="bubble-progress-fill" id="bubble-progress-fill"></div></div>
        </div>
        <div class="bubble-tail" aria-hidden="true"></div>
    </div>
</div>
<script type="application/json" id="mascot-config">{{ mascot_config | tojson }}</script>
