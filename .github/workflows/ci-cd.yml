name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Run all tests
  # ─────────────────────────────────────────
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check src/ tests/ app.py config.py gunicorn.conf.py generate_mascot_anim.py

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/test
          AI_MOCK: "true"
          CI: "true"
        run: pytest -v tests/